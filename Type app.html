<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing App</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>

        body{
            font-family: Arial, sans-serif;
            padding: 70px;
            padding-right: 20px;
            background: #f4f4f4;
           align-items: center;
            display: flex;
            justify-content: center;
        }

        .container{
            background: white;
            padding: 83px;
            width: 369px;
            border: 1px solid #ccc;
        }

        input{
            width: 100%;
            padding: 10px;
            font-size: 18px;
            margin-bottom: 20px;
        }

        p{
            font-size: 28px;
            margin-bottom: 20px;
        }

        button{
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

    </style>
</head>

<body>

    <div class="container">

        <input type="text" id="textbox" placeholder="Type something...">

        <p>You typed: <span id="output"></span></p>

        <button id="resetBtn">Reset</button>

    </div>

    <script>

        $("#textbox").keyup(function(){

            let text = $("#textbox").val();

            $("#output").text(text);

        });
        $("#resetBtn").click(function(){

            $("#textbox").val("");

            $("#output").text("");

        });

    </script>

</body>
</html>
